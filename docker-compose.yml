version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finance_controller_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_controller
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_controller_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finance_controller?schema=public
      - JWT_SECRET=super_secret_jwt_key_for_dev
      - PORT=5000
    depends_on:
      - db
    # In a real environment we would run migrations before starting
    # command: sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance_controller_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
