version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finance-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_dev
      POSTGRES_DB: razorpay_finance_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d razorpay_finance_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: finance-backend-dev
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma db push && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_dev@postgres:5432/razorpay_finance_dev?schema=public
      PORT: 5000
      JWT_SECRET: dev_jwt_secret_key
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: finance-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data_dev:
